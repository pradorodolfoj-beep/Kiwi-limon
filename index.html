<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Interactivo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal Formulario de Producto -->
  <div class="modal-wrap hidden" id="product-modal">
    <div class="modal-card small-modal" role="dialog" aria-modal="true" aria-labelledby="product-title">
      <div class="modal-head">
        <div>
          <h2 id="product-title">Nuevo producto</h2>
          <p>Agrega o modifica los detalles del producto.</p>
        </div>
        <button class="close-button" id="close-product" type="button" aria-label="Cerrar formulario">×</button>
      </div>
      <form class="form-stack" id="product-form">
        <input id="product-id" type="hidden">
        <label class="form-label">Nombre<input class="field" id="product-name" name="name" required></label>
        <div class="form-row">
          <label class="form-label">Categoría<select class="select-field" id="product-category" name="category"></select></label>
          <label class="form-label">Precio<input class="field" id="product-price" name="price" type="number" step=".01" min="0" required></label>
        </div>
        <label class="form-label">Ruta / URL de la Imagen<input class="field" id="product-image" name="image" placeholder="Ej: image/producto.jpg"></label>
        <label class="form-label">Descripción<textarea class="textarea-field" id="product-description" name="description"></textarea></label>
        <label class="check-row"><input id="product-weight" type="checkbox"> Se vende por kilogramo</label>
        
        <div class="form-label">
          <span>Tamaños (opcional)</span>
          <textarea class="textarea-field" id="product-sizes" placeholder="Ej: 10oz: 0, 14oz: 2"></textarea>
          <small class="field-help">Formato: Nombre: PrecioAdicional (separados por coma). Ejemplo: <code>10oz: 0, 14oz: 2</code></small>
        </div>

        <div class="modal-actions">
          <button class="primary-button" type="submit">✓ Guardar y copiar código</button>
          <button class="secondary-button" id="cancel-product" type="button">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Contenedor Principal del Menú / Vista de Administración -->
  <main class="main-container">
    <header class="app-header">
      <h1>Menú Digital</h1>
      <button class="secondary-button" id="open-admin-button" type="button">Panel Admin</button>
    </header>

    <section id="menu-section" class="menu-grid">
      <!-- Los productos se cargan dinámicamente -->
    </section>

    <!-- Vista Tabla de Administración -->
    <section id="admin-section" class="admin-panel hidden">
      <div class="admin-header">
        <h2>Administración de Productos</h2>
        <button class="primary-button" id="add-product-button" type="button">+ Agregar Producto</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
